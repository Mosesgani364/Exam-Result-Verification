name: CI
on: [push, pull_request]
jobs:
  tests:
    name: "Exam Result Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Setup Clarinet"
        uses: hirosystems/clarinet-setup@v1
        with:
          clarinet-version: 2.16.0
      - name: "Check contract syntax"
        working-directory: ./exam-verification
        run: clarinet check
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./exam-verification/package-lock.json
      - name: "Install dependencies"
        working-directory: ./exam-verification
        run: npm ci
      - name: "Run tests"
        working-directory: ./exam-verification
        run: npm test
