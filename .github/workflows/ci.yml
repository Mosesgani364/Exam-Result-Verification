name: CI
on: [push]
jobs:
  tests:
    name: "Exam Result Verification"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exam-verification
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check
      - name: "Install dependencies"
        run: npm install
      - name: "Run tests"
        run: npm test
