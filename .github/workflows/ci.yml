name: CI
on: [push, pull_request]
jobs:
  tests:
    name: "Exam Result Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: "Install Clarinet"
        run: |
          curl -L https://github.com/hirosystems/clarinet/releases/download/v2.16.0/clarinet-linux-x64.tar.gz -o clarinet.tar.gz
          tar -xzf clarinet.tar.gz
          sudo mv clarinet /usr/local/bin/
          clarinet --version
      - name: "Check contract syntax"
        working-directory: ./exam-verification
        run: clarinet check
      - name: "Install dependencies"
        working-directory: ./exam-verification
        run: npm install
      - name: "Run tests"
        working-directory: ./exam-verification
        run: npm test
