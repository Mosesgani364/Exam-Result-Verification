name: CI
on: [push]
jobs:
  tests:
    name: "Exam Result Verification"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check
        env:
          WORKING_DIR: ./exam-verification
